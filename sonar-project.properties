# SonarQube Cloud（原 SonarCloud）分析配置
sonar.projectKey=jdysw_ff14-glamour-zh
sonar.organization=encvsedvrfeqod6xwpj6wfidvu9z58mvgjnpipr2

# canonical 源码 + 正常构建脚本进入分析；历史一次性迁移工具不作为生产代码。
sonar.sources=src,build
sonar.exclusions=dist/**,data/**,dict/**,build/migrate/**

# 测试运行时使用独立 harness，不属于 Sonar 源码分析范围；覆盖率由测试命令单独验收。
sonar.coverage.exclusions=**/*

# S6861 在以下模块命中的是有意导出的 ES Module live binding：数据、缓存、词典与站点扫描状态必须随生命周期更新。
# 仅限定这些已审计状态模块，避免全局关闭该规则掩盖真正的 mutable export 问题。
sonar.issue.ignore.multicriteria=s6861state
sonar.issue.ignore.multicriteria.s6861state.ruleKey=javascript:S6861
sonar.issue.ignore.multicriteria.s6861state.resourceKey=src/core/(cache|data-manager|dictionary|probe|runtime)\.js|src/sites/(eorzea-collection|mirapri)\.js

sonar.sourceEncoding=UTF-8
