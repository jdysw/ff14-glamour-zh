# SonarQube Cloud（原 SonarCloud）分析配置
sonar.projectKey=jdysw_ff14-glamour-zh
sonar.organization=encvsedvrfeqod6xwpj6wfidvu9z58mvgjnpipr2

# canonical 源码 + 正常构建脚本进入分析；历史一次性迁移工具不作为生产代码。
sonar.sources=src,build
sonar.exclusions=dist/**,data/**,dict/**,build/migrate/**

# 测试运行时使用独立 harness，不属于 Sonar 源码分析范围；覆盖率由测试命令单独验收。
sonar.coverage.exclusions=**/*

sonar.sourceEncoding=UTF-8
