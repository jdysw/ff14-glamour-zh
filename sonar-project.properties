# SonarQube Cloud（原 SonarCloud）分析配置
sonar.projectKey=jdysw_ff14-glamour-zh
sonar.organization=encvsedvrfeqod6xwpj6wfidvu9z58mvgjnpipr2

# canonical 源码与当前构建脚本进入分析。
sonar.sources=src,build
sonar.exclusions=dist/**,data/**

# 合并 Node 22 V8 与同次浏览器端到端 V8 的真实源码行命中；保留原生分支记录。
# 构建工具不在用户脚本运行路径中，单独排除，而非屏蔽全部源文件。
sonar.javascript.lcov.reportPaths=tests/.cache/coverage/lcov.info
sonar.coverage.exclusions=build/**
