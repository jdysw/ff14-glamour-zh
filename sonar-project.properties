# SonarQube Cloud（原 SonarCloud）分析配置
# 项目键与组织键须与 SonarQube Cloud 上导入的项目一致（组织键从 SonarCloud 组织设置获取）
sonar.projectKey=jdysw_ff14-glamour-zh
sonar.organization=encvsedvrfeqod6xwpj6wfidvu9z58mvgjnpipr2

# 扫描范围：仅源码（userscript 手写源 + 构建脚本）
sonar.sources=src,build

# 保险排除：构建产物与数据文件（不在 sources 内，双重保险）
# 生成模块排除：src/core、src/sites 为 gen-modules 从单文件模板切出的机械副本
# （唯一手写源 = src/ff14-glamour-zh.external.user.js），纳入会引入重复行并吞没单源定义；
# 覆盖性由构建链 gen-modules/verify-modules/module-map 逐行断言，不依赖 Sonar 重复度检查。
sonar.exclusions=dist/**,data/**,dict/**,src/core/**,src/sites/**,src/main.js

# 项目为油猴脚本 + 构建脚本，无自动化测试体系：
# 覆盖率无从统计（new_coverage 恒 0 会误卡质量门），故整体排除覆盖率统计。
sonar.coverage.exclusions=**/*

sonar.sourceEncoding=UTF-8
