name: Check isolated Cloudflare upstream deploy
on:
  push:
    branches: [deploy/cloudflare-upstream-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check linked credentials without printing them
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          test -n "$CF_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          echo 'Cloudflare deployment credentials are configured.'
