name: Sonar PR27 finding inspection (temporary)
on:
  push:
    branches: [feat/audit-localization-20261009]
    paths: [.github/workflows/sonar-pr27-inspection.yml]
permissions:
  contents: read
jobs:
  findings:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://sonarcloud.io/api/issues/search?componentKeys=jdysw_ff14-glamour-zh&pullRequest=27&resolved=false&ps=100'
          try:
              with urllib.request.urlopen(url, timeout=20) as resp: data=json.load(resp)
              print("SONAR_TOTAL",data.get('total',0))
              for issue in data.get('issues',[]):
                  print("SONAR_ISSUE",json.dumps({k:issue.get(k) for k in ['severity','rule','message','component','line','type','status']},ensure_ascii=False))
          except Exception as e: print("SONAR_ERROR",str(e))
          PY