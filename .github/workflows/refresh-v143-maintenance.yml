name: Refresh 1.4.3 release and clean merged branch

# One-time maintenance workflow; remove this file after successful execution.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v143-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: refresh-v143-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jdysw/ff14-glamour-zh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out updated 1.4.3 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify merged code and build release asset
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.4.3"
          git merge-base --is-ancestor a78a36635644b1382cc13e51913ea842d87ff5c2 HEAD
          git merge-base --is-ancestor 06397967c680c96976cfd83f37e6c5a67df57cbe HEAD
          npm ci
          bash build.sh
          npm run version:check
          npm run check:dist
          git diff --exit-code
          test -s dist/ff14-glamour-zh.greasyfork.user.js
          grep -Eq '^// @version[[:space:]]+1\.4\.3$' dist/ff14-glamour-zh.greasyfork.user.js
          sha256sum dist/ff14-glamour-zh.greasyfork.user.js

      - name: Write complete updated release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 1.4.3 更新内容（2026-10-10 补充）

          本次在 **1.4.3** 内整合了已通过测试的 [PR #39](https://github.com/jdysw/ff14-glamour-zh/pull/39) 和 [PR #34](https://github.com/jdysw/ff14-glamour-zh/pull/34)，**不升级为 1.5.0**。原有 1.4.3 功能全部保留。

          ### 中文装备搜索与输入体验（#39）
          - 六个幻化站统一中文装备智能候选；支持正式中文名、中文别名的前缀与连续子串匹配。
          - 候选按 **头部 → 身体 → 手部 → 腿部 → 脚部 → 其余部位** 排序，各部位内部按完整命中、正式名前缀、正式名包含、别名前缀、别名包含排序。
          - 部位分类来自游戏数据 `EquipSlotCategory`，旧 V3 缓存安全兼容；新部位信息需获取更新后的 V3 数据才会生效。
          - 提交行为适配 Mirapri、Eorzea Collection、FF14-FC、Ronka LookBook、FFXIV ARMOURY COLLECTION、End Closet，保留站点原生筛选和搜索逻辑。
          - 移动端增加 44px 触控候选行、可视视口适配与每批 80 行的渐进渲染，避免大量候选一次渲染引起卡顿。
          - 增加搜索单测与集成测试，并修复 SonarQube 复杂度问题。

          ### Eorzea Collection Gearsets 中文搜索（#34）
          - 扩充历史 Gearsets 套装译名目录，包括雾迹、雾忆、沃·克劳德、普利修、马雅科夫、口之院，以及部分商城／特殊奖励／生产采集套装。
          - 中文模糊搜索支持连续片段、标点与空格差异；多套命中时仅使用安全的共同完整英文词组，必要时由候选明确选择。
          - Gearsets 未命中提示改为「未找到对应套装」，不会误用单件物品搜索；保留原 `/gearset/<slug>` 链接及其他页面行为。
          - 套装目录按词典修订号缓存，补充翻译与搜索回归测试。

          ### 原有 1.4.3 变更（保留）
          - 全面切换 **V3-only** 数据加载，移除 V2 下载、缓存读取及回退链路；旧 V2 数据地址已退役。
          - 首次升级时清理旧数据缓存并获取 V3 数据，同时保留用户设置；常规更新失败保留上一次可用的 V3 缓存。
          - 补齐 Mirapri 英文染剂翻译；候选仅包含可幻化装备、时尚配饰和鸟甲。
          - 原有 EC 套装汉化、中文部分词搜索及测试维护继续保留。

          ### 安装与更新说明
          - 请使用本 Release 下的 `ff14-glamour-zh.greasyfork.user.js` 附件安装或覆盖安装。
          - **同版本附件已重新构建并替换**；由于 `@version` 仍为 **1.4.3**，用户脚本管理器通常不会自动提示同版本更新，需要手动覆盖安装才能获得上述增强。
          - 此次保留原 `v1.4.3` Git 标签（对应最初 1.4.3 提交），附件则使用包含 #34 和 #39 的最新 `main` 源码构建；因此历史标签源码与更新后的附件不同。安装请以附件为准。
          - 第一次获取／刷新 V3 数据需要联网。实际站点和手机端的特殊交互仍可能需要实机复验。

          [完整源码更新对比（v1.4.2 → 当前 main）](https://github.com/jdysw/ff14-glamour-zh/compare/v1.4.2...main)
          NOTES

      - name: Replace existing v1.4.3 release attachment and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v1.4.3 "dist/ff14-glamour-zh.greasyfork.user.js" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v1.4.3 --title "v1.4.3 正式版" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"

      - name: Verify release attachment and description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v143-download"
          gh release download v1.4.3 --pattern "ff14-glamour-zh.greasyfork.user.js" --dir "$RUNNER_TEMP/v143-download" --repo "$GITHUB_REPOSITORY"
          cmp -s dist/ff14-glamour-zh.greasyfork.user.js "$RUNNER_TEMP/v143-download/ff14-glamour-zh.greasyfork.user.js"
          gh release view v1.4.3 --json body --repo "$GITHUB_REPOSITORY" --jq .body > "$RUNNER_TEMP/v143-final-notes.md"
          grep -Fq "PR #39" "$RUNNER_TEMP/v143-final-notes.md"
          grep -Fq "PR #34" "$RUNNER_TEMP/v143-final-notes.md"
          gh release view v1.4.3 --json assets --repo "$GITHUB_REPOSITORY" --jq '.assets[].name' | grep -Fxq "ff14-glamour-zh.greasyfork.user.js"
          echo "Release asset checksum and notes verified."

      - name: Delete obsolete merged PR34 helper branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="sync/pr34-1.4.3"
          expected="de7526fd37335bbfbecf6b6d29a4ee29c0131636"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq .object.sha)"
          test "$actual" = "$expected"
          git fetch --no-tags origin "refs/heads/$ref:refs/remotes/origin/$ref"
          git diff --quiet "origin/$ref" HEAD -- \
            docs/ec-gearsets-catalog.md src/core/chinese-search.js \
            src/sites/eorzea-collection.js tests/unit/test-ec-gearsets.mjs \
            tests/unit/test-ec-manual-audit.mjs
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref"
          echo "Deleted obsolete branch $ref without losing any of its changed files."
