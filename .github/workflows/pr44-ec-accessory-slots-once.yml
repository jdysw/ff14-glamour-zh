name: PR44 Generate official EC accessory slot candidates (one-time)
on:
  push:
    branches:
      - feat/ec-gearsets-auto-translate-143
    paths:
      - .github/workflows/pr44-ec-accessory-slots-once.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download official FF14 game sheets
        run: |
          set -euo pipefail
          mkdir -p /tmp/ff14-ec-classes
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/xivapi/ffxiv-datamining/master/csv/en/Item.csv' -o /tmp/ff14-ec-classes/Item.csv
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/xivapi/ffxiv-datamining/master/csv/en/ItemAction.csv' -o /tmp/ff14-ec-classes/ItemAction.csv
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/xivapi/ffxiv-datamining/master/csv/en/Glasses.csv' -o /tmp/ff14-ec-classes/Glasses.en.csv
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/thewakingsands/ffxiv-datamining-cn/master/Glasses.csv' -o /tmp/ff14-ec-classes/Glasses.zh.csv
          wc -c /tmp/ff14-ec-classes/*.csv
      - name: Regenerate and verify all scoped EC candidate sets
        run: |
          set -euo pipefail
          args=(--item /tmp/ff14-ec-classes/Item.csv --actions /tmp/ff14-ec-classes/ItemAction.csv --glasses-en /tmp/ff14-ec-classes/Glasses.en.csv --glasses-zh /tmp/ff14-ec-classes/Glasses.zh.csv)
          python3 tools/update-ec-search-categories.py "${args[@]}"
          python3 tools/update-ec-search-categories.py "${args[@]}" --check
          grep '^const EC_ACCESSORY_SLOT_NATIVES' src/core/chinese-search.js | wc -c
      - name: Publish generated data and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr44-ec-accessory-slots-once.yml
          git add src/core/chinese-search.js
          git commit -m 'data(ec): generate earrings/necklace/bracelet/ring classification from official Item.csv'
          git push origin HEAD:refs/heads/feat/ec-gearsets-auto-translate-143
