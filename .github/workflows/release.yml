name: Release

# 版本发布自动化（v1.4 Phase 17：版本单一源 = package.json）。
# 触发：src/、build/ 或 package.json 推送到 main → 读取 package.json 版本 → 幂等检查 →
#       构建（build.sh 全链，含版本同步与词典三方核验）→ 一致性校验（package ≡ src ≡ header ≡ dist）
#       → 创建 v<版本> tag + Release（附发布件）。
# 版本号已有 Release 则自动跳过（幂等）；也可在 Actions 页手动触发（补发/演练）。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读取版本号（单一源：package.json）
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "package.json version 非法：$V"; exit 1; }
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

      - name: 检查是否已发布（幂等跳过）
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.ver }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.ver }} 已存在，跳过发布"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖（锁文件）
        if: steps.chk.outputs.skip == '0'
        run: npm ci

      - name: 构建（build.sh 全链）
        if: steps.chk.outputs.skip == '0'
        run: bash build.sh

      - name: 版本一致性校验（package ≡ src ≡ header ≡ dist）
        if: steps.chk.outputs.skip == '0'
        run: npm run version:check

      - name: 创建 Release
        if: steps.chk.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.ver }}" \
            "dist/ff14-glamour-zh.greasyfork.user.js#FF14 幻化站中文化 v${{ steps.v.outputs.ver }}（Greasy Fork 发布件）" \
            --title "v${{ steps.v.outputs.ver }}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
