name: Release

# 发布必须由维护者手动操作。合并开发代码进入
# main 不应自动创建发行版，也不能复用已发布版本号。
# 只有明确决定发版时，才单独调整版本号。
on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm the commit is still main HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TARGET_SHA" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "Main advanced to $main_sha; skipping stale release candidate $TARGET_SHA."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Require tests, CodeQL and Sonar successful on the exact commit
        if: steps.current.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100")"
            result="$(printf '%s' "$checks_json" | node -e '
              const checks = JSON.parse(require("fs").readFileSync(0, "utf8")).check_runs || [];
              const names = [
                "Build & Verify", "Unit Tests", "Integration A (Wiki)",
                "Integration B (Sites)", "Integration C (Contracts)",
                "Analyze (javascript-typescript)", "Analyze (python)", "Analyze (actions)",
                "SonarQube Cloud Scan", "SonarCloud Code Analysis"
              ];
              if (checks.some((check) => check.name === "CodeQL")) names.push("CodeQL");
              const pending = [], failed = [];
              for (const name of names) {
                const matches = checks.filter((check) => check.name === name).sort((a, b) => b.id - a.id);
                const latest = matches[0];
                if (!latest || latest.status !== "completed") pending.push(name);
                else if (latest.conclusion !== "success" &&
                  !(name === "CodeQL" && latest.conclusion === "neutral")) {
                  failed.push(name + ": " + latest.conclusion);
                }
              }
              if (failed.length) console.log("FAIL " + failed.join(", "));
              else if (pending.length) console.log("WAIT " + pending.join(", "));
              else console.log("OK");
            ')"
            echo "Quality gates: $result"
            case "$result" in
              OK) exit 0 ;;
              FAIL*) exit 1 ;;
            esac
            sleep 10
          done
          echo "Required security and quality checks timed out." >&2
          exit 1

      - name: Read validated version
        if: steps.current.outputs.skip == '0'
        id: v
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid package version: $V"; exit 1; }
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - name: Prevent unpublished changes under an existing version
        if: steps.current.outputs.skip == '0'
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${{ steps.v.outputs.ver }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$tag_sha" != "$TARGET_SHA" ]; then
              echo "$tag already points to $tag_sha; increment package.json version before releasing $TARGET_SHA." >&2
              exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "$tag already represents this exact commit; no duplicate release."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned dependencies
        if: steps.current.outputs.skip == '0' && steps.chk.outputs.skip == '0'
        run: npm ci

      - name: Build and verify reproducible userscript
        if: steps.current.outputs.skip == '0' && steps.chk.outputs.skip == '0'
        run: |
          npm run validate:data
          npm run build
          npm run check:dist
          npm run version:check
          git diff --exit-code

      - name: Recheck main HEAD before publishing
        if: steps.current.outputs.skip == '0' && steps.chk.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_sha" != "$TARGET_SHA" ]; then
            echo "main advanced during verification; refusing to publish stale commit $TARGET_SHA." >&2
            exit 1
          fi

      - name: Create tagged release for verified SHA
        if: steps.current.outputs.skip == '0' && steps.chk.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "v${{ steps.v.outputs.ver }}" \
            "dist/ff14-glamour-zh.greasyfork.user.js#FF14 幻化站中文化 v${{ steps.v.outputs.ver }}（Greasy Fork 发布件）" \
            --target "$TARGET_SHA" \
            --title "v${{ steps.v.outputs.ver }}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
