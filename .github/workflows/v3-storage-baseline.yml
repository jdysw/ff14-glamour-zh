name: V3 Storage Baseline

# 仅分析真实生成的数据包；绝不发布 Cloudflare，也不修改脚本版本。
on:
  pull_request:
    paths:
      - 'tools/data/**'
      - 'tests/experimental/test-storage-audit.mjs'
      - 'tests/unit/test-shared-candidates.mjs'
      - 'tests/unit/test-pages-assets.mjs'
      - 'build/data/**'
      - 'src/core/site-config.json'
      - 'data/source/**'
      - 'data/dictionaries/**'
      - '.github/deploy/**'
      - '.github/workflows/v3-storage-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 获取固定版本的装备部位 CSV 并校验 Git blob
        env:
          DATAMINING_COMMIT: 52a72b38aa2f967cab36867f34cd9bee9debb88b
          EXPECTED_ITEM_BLOB: 40b6d77a89ba2ab3f69aa39b9f4772af6f9a10be
        run: |
          set -euo pipefail
          mkdir -p build/.cache/datamining
          # 固定提交的原始文件优先；CDN 暂时拒绝请求时不应阻断常规数据更新。
          if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            "https://raw.githubusercontent.com/xivapi/ffxiv-datamining/${DATAMINING_COMMIT}/csv/en/Item.csv" \
            --output build/.cache/datamining/en-Item.csv; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
              "https://cdn.jsdelivr.net/gh/xivapi/ffxiv-datamining@${DATAMINING_COMMIT}/csv/en/Item.csv" \
              --output build/.cache/datamining/en-Item.csv
          fi
          test "$(git hash-object build/.cache/datamining/en-Item.csv)" = "$EXPECTED_ITEM_BLOB"
      - name: 生成真实 V3 产物
        env:
          FF14_EQUIP_SLOTS_CSV: build/.cache/datamining/en-Item.csv
        run: python3 build/data/prepare-pages.py
      - name: 运行存储审计及基准报告
        run: |
          node tests/experimental/test-storage-audit.mjs
          node tests/unit/test-shared-candidates.mjs
          node tests/unit/test-pages-assets.mjs
          node tests/unit/test-pages-dedupe.mjs
          node tests/unit/test-pages-production.mjs
          node tools/data/verify-shared-candidates.mjs --dir site/ff14/v3
          node tools/data/verify-pages-assets.mjs --dir site
          node tools/data/audit-storage.mjs --dir site/ff14/v3 --out storage-baseline.json
      # 不发布 Cloudflare：模拟与正式部署相同的完整 V3 校验 → 去重流程。
      - name: V3 旧 URL 透明去重与 Pages 产物验收
        run: |
          node tools/data/dedupe-pages.mjs --site site | tee pages-dedupe-summary.log
          node tools/data/dedupe-pages.mjs --site site --verify
          node tools/data/verify-pages-assets.mjs --dir site
      # 在 Cloudflare 官方 Wrangler 本地 Pages 运行时检查 200 内部代理响应；
      # 不是普通的文件系统模拟，能发现重写规则不生效、404 或可见跳转。
      - name: Wrangler Pages 本地 HTTP 验证原 V3 URL
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages dev site --ip 127.0.0.1 --port 8788 --log-level error > pages-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8788/ff14/v3/manifest.json -o /dev/null 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat pages-dev.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat pages-dev.log
            exit 1
          fi
          node tools/data/verify-pages-http.mjs --site site --origin http://127.0.0.1:8788
      # PR 候选数据已在上方严格验证；线上尚未发布该候选版本，
      # 因此线上基线须使用目标分支的完整契约，不能要求提前部署 PR。
      - name: 获取 PR 目标分支的线上基线契约
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .production-baseline
          persist-credentials: false
      - name: 按已发布基线核实线上 V3 全部资源路径
        working-directory: ${{ github.event_name == 'pull_request' && '.production-baseline' || '.' }}
        run: node tools/data/verify-pages-production.mjs --origin https://zhixia-data.pages.dev/
      - name: 上传 V3 旧 URL 去重计划与规则
        uses: actions/upload-artifact@v4
        with:
          name: v3-pages-dedupe
          path: |
            site/_redirects
            pages-dedupe-summary.log
          if-no-files-found: error
      - name: 上传原始报告（不上传数据源）
        uses: actions/upload-artifact@v4
        with:
          name: v3-storage-baseline
          path: storage-baseline.json
          if-no-files-found: error
