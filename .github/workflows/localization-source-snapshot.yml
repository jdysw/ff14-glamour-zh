name: Export source snapshot for localization audit
on:
  push:
    branches: [feat/audit-localization-20261009]
    paths: [.github/workflows/localization-source-snapshot.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar czf /tmp/ff14-localization-source.tar.gz --exclude=.git --exclude=node_modules .
      - uses: actions/upload-artifact@v4
        with:
          name: ff14-localization-source
          path: /tmp/ff14-localization-source.tar.gz
          retention-days: 7
