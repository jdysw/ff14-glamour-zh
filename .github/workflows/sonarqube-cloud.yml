name: SonarQube Cloud

# SonarQube Cloud（原 SonarCloud）代码质量与安全扫描。
# 使用 CI 分析模式（需在 SonarQube Cloud 项目里关闭 Automatic Analysis）。
# SONAR_TOKEN 存放于仓库 Secrets（Settings → Secrets and variables → Actions）。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: read # 允许 SonarQube Cloud 在 PR 上装饰分析结果

jobs:
  sonarqube-cloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：新代码判定与逐行归属需要

      # 仅汇报真正导入并执行过的生产 ESM 模块；不得人为填写覆盖率。
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成真实源码覆盖率（LCOV）
        run: npm run test:coverage

      # 官方扫描 action（v6：使用当前受支持版本）
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 临时审计定位：只打印规则/行号/描述，不输出访问令牌。
      - name: 诊断本 PR 的 Sonar 新增规则（临时）
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          token = os.environ['SONAR_TOKEN']
          credentials = base64.b64encode((token + ':').encode()).decode()
          url = 'https://sonarcloud.io/api/issues/search?componentKeys=jdysw_ff14-glamour-zh&pullRequest=50&ps=100'
          request = urllib.request.Request(url, headers={'Authorization': 'Basic ' + credentials})
          with urllib.request.urlopen(request, timeout=30) as response:
              issues = json.load(response).get('issues', [])
          print('PR Sonar 新增问题:', len(issues))
          for issue in issues:
              print(json.dumps({k: issue.get(k) for k in ('rule', 'severity', 'component', 'line', 'message', 'issueStatus')}, ensure_ascii=False))
          PY

