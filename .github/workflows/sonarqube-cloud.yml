name: SonarQube Cloud

# SonarQube Cloud（原 SonarCloud）代码质量与安全扫描。
# 使用 CI 分析模式（需在 SonarQube Cloud 项目里关闭 Automatic Analysis）。
# SONAR_TOKEN 存放于仓库 Secrets（Settings → Secrets and variables → Actions）。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: read # 允许 SonarQube Cloud 在 PR 上装饰分析结果

jobs:
  sonarqube-cloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：新代码判定与逐行归属需要

      # 仅汇报真正导入并执行过的生产 ESM 模块；不得人为填写覆盖率。
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成真实源码覆盖率（LCOV）
        run: npm run test:coverage

      # 官方扫描 action（v6：使用当前受支持版本）
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 扫描执行成功不代表质量门禁通过；必须等待服务器端 Quality Gate 结果。
      - name: 等待 SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 仅当质量门禁失败时输出问题定位信息；令牌只作为请求凭据，不写入日志。
      - name: 输出未解决 Sonar 问题位置
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=jdysw_ff14-glamour-zh" \
            --data-urlencode "pullRequest=${{ github.event.pull_request.number }}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=100" \
            "https://sonarcloud.io/api/issues/search" \
            | jq -r '.issues[] | [.rule, .severity, .component, (.line // .textRange.startLine // "-"), .message] | @tsv'
