name: SonarQube Cloud

# SonarQube Cloud（原 SonarCloud）代码质量与安全扫描。
# 使用 CI 分析模式（需在 SonarQube Cloud 项目里关闭 Automatic Analysis）。
# SONAR_TOKEN 存放于仓库 Secrets（Settings → Secrets and variables → Actions）。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: read # 允许 SonarQube Cloud 在 PR 上装饰分析结果

jobs:
  sonarqube-cloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：新代码判定与逐行归属需要

      # 仅汇报真正导入并执行过的生产 ESM 模块；不得人为填写覆盖率。
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成真实源码覆盖率（LCOV）
        run: npm run test:coverage

      # 官方扫描 action（v6：使用当前受支持版本）
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 扫描执行成功不代表质量门禁通过；必须等待服务器端 Quality Gate 结果。
      - name: 等待 SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Quality Gate 通过仍可能留有历史问题；独立导出 main 上真正未解决的告警。
      # 问题位置进入 Actions 工件，令牌只用于请求授权，绝不存入工件。
      - name: 导出 main 分支全部未解决 Sonar 告警
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=jdysw_ff14-glamour-zh" \
            --data-urlencode "branch=main" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            | jq '{total, paging, issues: [.issues[] | {
                key, rule, severity, type, message, component,
                line: (.line // .textRange.startLine // null),
                effort, status, impacts
              }]}' > sonar-unresolved.json
          jq -r '"main 分支 Sonar 未解决告警数：\\(.total)"' sonar-unresolved.json
          jq -r '.issues[] | [.rule, .severity, .component,
            (.line // "-"), .message] | @tsv' sonar-unresolved.json
          jq -e '(.total // 0) <= 500' sonar-unresolved.json >/dev/null
      - name: 上传 Sonar 未解决告警清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-unresolved-main
          path: sonar-unresolved.json
          if-no-files-found: warn
