name: SonarQube Cloud

# SonarQube Cloud（原 SonarCloud）代码质量与安全扫描。
# 使用 CI 分析模式（需在 SonarQube Cloud 项目里关闭 Automatic Analysis）。
# SONAR_TOKEN 存放于仓库 Secrets（Settings → Secrets and variables → Actions）。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: read # 允许 SonarQube Cloud 在 PR 上装饰分析结果

jobs:
  sonarqube-cloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：新代码判定与逐行归属需要

      # 仅汇报真正导入并执行过的生产 ESM 模块；不得人为填写覆盖率。
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成真实源码覆盖率（LCOV）
        run: npm run test:coverage

      # 官方扫描 action（v6：使用当前受支持版本）
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 扫描执行成功不代表质量门禁通过；必须等待服务器端 Quality Gate 结果。
      - name: 等待 SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Quality Gate 通过仍可能留有历史问题；独立导出 main 上真正未解决的告警。
      # 问题位置进入 Actions 工件，令牌只用于请求授权，绝不存入工件。
      - name: 导出 main 分支全部未解决 Sonar 告警
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=jdysw_ff14-glamour-zh" \
            --data-urlencode "branch=main" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            | jq '{total, paging, issues: [.issues[] | {
                key, rule, severity, type, message, component,
                line: (.line // .textRange.startLine // null),
                effort, status, impacts
              }]}' > sonar-unresolved.json
          jq -r '.total' sonar-unresolved.json
          jq -r '.issues[] | [.rule, .severity, .component,
            (.line // "-"), .message] | @tsv' sonar-unresolved.json
          jq -e '(.total // 0) <= 500' sonar-unresolved.json >/dev/null
      - name: 上传 Sonar 未解决告警清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-unresolved-main
          path: sonar-unresolved.json
          if-no-files-found: warn

      # PR 分支单独统计本次改动引起的 Sonar 告警，避免与历史 main 告警混淆。
      - name: 导出当前 PR 未解决 Sonar 告警
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=jdysw_ff14-glamour-zh" \
            --data-urlencode "pullRequest=${SONAR_PR_NUMBER}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            | jq '{total, issues: [.issues[] | {
                key, rule, severity, message, component,
                line: (.line // .textRange.startLine // null), status
              }]}' > sonar-unresolved-pr.json
          jq -r '.total' sonar-unresolved-pr.json
          jq -r '.issues[] | [.rule, .component, (.line // "-"), .message] | @tsv' sonar-unresolved-pr.json
      - name: 上传当前 PR 未解决 Sonar 告警清单
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-unresolved-pr
          path: sonar-unresolved-pr.json
          if-no-files-found: error

      # 记录 Sonar 服务端真实统计口径；覆盖率不能只看 V8 测试终端输出。
      # PR 与 main 分支分别查询，避免把“新代码覆盖率”误称成全项目覆盖率。
      - name: 导出 Sonar 全量覆盖率与未覆盖文件明细
        if: ${{ success() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p sonar-metrics
          scope="branch=main"
          if [ "$SONAR_EVENT" = "pull_request" ]; then
            scope="pullRequest=$SONAR_PR_NUMBER"
          fi
          metrics="coverage,line_coverage,branch_coverage,lines_to_cover,uncovered_lines,conditions_to_cover,uncovered_conditions"
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "component=jdysw_ff14-glamour-zh" \
            --data-urlencode "metricKeys=$metrics" \
            --data-urlencode "$scope" \
            "https://sonarcloud.io/api/measures/component" \
            | jq '{component: .component.key, measures: .component.measures}' > sonar-metrics/overall.json
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "component=jdysw_ff14-glamour-zh" \
            --data-urlencode "metricKeys=$metrics" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "ps=500" \
            --data-urlencode "$scope" \
            "https://sonarcloud.io/api/measures/component_tree" \
            | jq '{paging, components: [.components[] | {key, path, qualifier, measures}]}' > sonar-metrics/files.json
          jq -r '.measures[] | [.metric, (.value // "-")] | @tsv' sonar-metrics/overall.json
          jq -r '.components[] | [.path, ([.measures[] | select(.metric == "coverage") | .value][0] // "0")] | @tsv' sonar-metrics/files.json
          jq -e '(.paging.total // 0) <= 500' sonar-metrics/files.json >/dev/null

      - name: 上传 Sonar 实际覆盖率与文件级缺口
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage-metrics
          path: sonar-metrics/*.json
          if-no-files-found: warn
