name: Deploy data station

# 当 data/ 下三个数据文件在 main 分支变化时，自动组装并部署到 Cloudflare Pages。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
# 依赖 repo secrets：CLOUDFLARE_API_TOKEN（仅 Pages 读写权限）、CLOUDFLARE_ACCOUNT_ID。
# v1.4 Phase 17：部署前先做数据文件结构校验（build/validate-data.py，与 Test 工作流同源）。

on:
  push:
    branches: [main]
    paths:
      - 'data/ff14-items.tsv'
      - 'data/ff14-series.txt'
      - 'data/acl-cfc.txt'
      - 'dict/**'
      - 'build/make-runtime-data.py'
      - 'build/make_dict_json.py'
      - '.github/deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 数据文件校验（结构完整性）
        run: python3 build/validate-data.py

      - name: Assemble site
        run: python3 .github/deploy/prepare.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ff14-glamour-zh --branch=main --commit-dirty=true
