name: Deploy data station

# 当 V3 canonical 数据、生成器、词典或部署配置变化时，自动组装并部署到 Cloudflare Pages。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
# 依赖 repo secrets：CLOUDFLARE_API_TOKEN（仅 Pages 读写权限）、CLOUDFLARE_ACCOUNT_ID。
# 部署前校验 canonical 数据结构；prepare.py 清理 site/ 后仅生成 V3。

on:
  push:
    branches: [main]
    paths:
      - 'data/ff14-items.tsv'
      - 'data/ff14-series.txt'
      - 'data/acl-cfc.txt'
      - 'dict/**'
      - 'build/make-runtime-data.py'
      - 'build/make_dict_json.py'
      - 'build/validate-data.py'
      # 发布链/契约的修复必须真正触发部署，不能被 paths 过滤悄悄跳过。
      - 'tools/data/dedupe-pages.mjs'
      - 'tools/data/verify-publish-contract.mjs'
      - 'tools/data/verify-shared-candidates.mjs'
      - 'tools/data/verify-pages-assets.mjs'
      - 'tools/data/verify-pages-production.mjs'
      - 'src/core/v3-contract.js'
      - 'src/core/dict-contract.js'
      - 'src/core/site-policy.js'
      - '.github/workflows/deploy-data.yml'
      - '.github/deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 数据文件校验（结构完整性）
        run: python3 build/validate-data.py

      - name: 获取固定版本的权威装备部位数据（FFXIV Item.csv）
        env:
          # 固定上游提交及该提交树中 Item.csv 的 Git blob ID。
          # 提交、文件校验值必须一起更新，避免 CDN 返回未经审查的新数据。
          DATAMINING_COMMIT: d9582a624eaec69d45649366dee801c2f3a6e9b3
          EXPECTED_ITEM_BLOB: 7ba78567b60c763375f2f0596119cd5aff149229
        run: |
          set -euo pipefail
          mkdir -p build/.cache/datamining
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 240 \
            "https://cdn.jsdelivr.net/gh/xivapi/ffxiv-datamining@${DATAMINING_COMMIT}/csv/en/Item.csv" \
            --output build/.cache/datamining/en-Item.csv
          test -s build/.cache/datamining/en-Item.csv
          # Git blob ID 校验文件完整字节，与上述固定提交树中的对象一致。
          actual_blob="$(git hash-object build/.cache/datamining/en-Item.csv)"
          if [ "$actual_blob" != "$EXPECTED_ITEM_BLOB" ]; then
            echo "::error::官方 Item.csv 校验失败：预期 $EXPECTED_ITEM_BLOB，实际 $actual_blob" >&2
            exit 1
          fi
          echo "权威数据完整性校验通过：${DATAMINING_COMMIT} / ${EXPECTED_ITEM_BLOB}"
          sha256sum build/.cache/datamining/en-Item.csv

      - name: Assemble site
        env:
          FF14_EQUIP_SLOTS_CSV: build/.cache/datamining/en-Item.csv
        run: python3 .github/deploy/prepare.py

      - name: Node 22（数据与脚本端统一契约）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 发布前校验 V3 数据、共享资源及 Pages 平台约束
        run: |
          node tools/data/verify-publish-contract.mjs --dir site/ff14/v3
          node tools/data/verify-shared-candidates.mjs --dir site/ff14/v3
          node tools/data/verify-pages-assets.mjs --dir site

      # 先校验全部原始文件，再把完全相同的资源改为 200 内部代理规则。
      # manifest 和旧用户脚本 URL 均不变；任何规则或文件错误会阻止上传。
      - name: 去除 Pages V3 重复静态副本并校验旧 URL 内容
        run: |
          node tools/data/dedupe-pages.mjs --site site
          node tools/data/dedupe-pages.mjs --site site --verify
          node tools/data/verify-pages-assets.mjs --dir site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ff14-glamour-zh --branch=main --commit-dirty=true

      # Pages 部署 API 返回 success 只表示上传完成，不代表旧 URL 透明重写可达。
      # 读取正式域名的 manifest，并逐条核对 27 个资源的 HTTP 200、长度和 SHA；
      # 失败时将此 Actions 明确标红，避免静默发布错误资源。
      - name: 发布后线上 V3 完整性探针（旧 URL / 200 / SHA）
        run: node tools/data/verify-pages-production.mjs --origin https://zhixia-data.pages.dev/
