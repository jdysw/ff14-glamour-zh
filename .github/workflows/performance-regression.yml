name: Reproducible EC performance benchmarks

# 构建产物、V3 数据或基准输入变化时运行；真实站点访问由独立在线审计负责。
on:
  pull_request:
    paths:
      - 'src/**'
      - 'build/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/benchmark/**'
      - 'tests/fixtures/ec-page.html'
      - 'tests/helpers/**'
      - 'tests/run.mjs'
      - '.github/workflows/performance-regression.yml'
  workflow_dispatch:

concurrency:
  group: ec-performance-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chrome-benchmark:
    name: Chrome CPU throttling 4×
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 编译规范用户脚本
        run: npm run build
      - name: 收集五轮模拟移动端 P50/P95 和 JS 堆占用
        env:
          CI: 'true'
          ZHX_BENCH_ROUNDS: '5'
          ZHX_BENCH_CPU_RATE: '4'
          ZHX_TEST_TIMEOUT_MS: '900000'
        run: npm run test:bench
      - name: 上传原始性能样本和统计报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ec-chrome-performance-reports
          path: tests/.cache/bench/
          retention-days: 14
          if-no-files-found: error
