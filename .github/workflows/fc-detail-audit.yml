name: FC actual detail-page semantic evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/audit-fc-details.py'
      - '.github/workflows/fc-detail-audit.yml'
permissions:
  contents: read
concurrency:
  group: fc-detail-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Avoid refetching the full external catalogue on unrelated updates
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq -e tools/audit-fc-details.py -e .github/workflows/fc-detail-audit.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Collect reconciled catalogue
        if: steps.scope.outputs.run == 'true'
        run: node tools/audit-fc-series.mjs
      - name: Collect real equipment slots and match offline official Item names
        if: steps.scope.outputs.run == 'true'
        run: python3 tools/audit-fc-details.py tests/.cache/fc-series-audit/fc-series-audit.json tests/.cache/fc-detail-audit
      - name: Preserve full or partial detail evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fc-detail-semantic-evidence
          path: |
            tests/.cache/fc-series-audit/fc-series-audit.json
            tests/.cache/fc-detail-audit/
          retention-days: 14
          if-no-files-found: warn
