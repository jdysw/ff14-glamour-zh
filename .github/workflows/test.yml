name: Test

# v1.4 Phase 17：CI 测试工作流（与本地同一入口，命令全部可本地复跑）。
# 覆盖：数据文件结构校验 → 构建（build.sh 全链，含版本同步与词典三方核验）→
#       产物语法检查 → 生成物一致性（构建后工作区应无差异）→ 单元 + 集成（离线夹具）测试。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 数据文件校验
        run: npm run validate:data

      - name: 构建（build.sh 全链）
        run: npm run build

      - name: 产物语法检查
        run: npm run check:dist

      - name: 覆盖审计 Python 云端执行器语法检查
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('tools/coverage-audit/cloud-audit.py').read_text(encoding='utf-8'))"

      - name: 云端审计 URL / 注入失败防线回归（纯标准库）
        run: python3 -m unittest discover -s tools/coverage-audit -p 'test_cloud_audit.py'

      # 生成物入库纪律：src 模块 / 词典块 / 版本号均为构建生成物，
      # 构建后工作区应无差异（有差异 = 提交内容与构建链输出不同步）。
      - name: 构建后工作区一致性
        run: git diff --exit-code

      - name: 构建可重现与损坏产物拒绝
        run: npm run test:build

      - name: 共享已验证的 userscript
        uses: actions/upload-artifact@v4
        with:
          name: userscript-build
          path: dist/ff14-glamour-zh.greasyfork.user.js
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Native Source Coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成真实 V8 / LCOV 源码覆盖率
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: native-source-lcov
          path: tests/.cache/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

  unit:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 下载已验证构建产物
        uses: actions/download-artifact@v4
        with:
          name: userscript-build
          path: dist

      - name: 单元测试（纯 Node，秒级）
        run: node tests/run.mjs --suite=unit

  integration-a:
    name: Integration A (Wiki)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 下载已验证构建产物
        uses: actions/download-artifact@v4
        with:
          name: userscript-build
          path: dist

      - name: 集成测试 A（wiki 夹具组）
        run: node tests/run.mjs --suite=wiki

  integration-b:
    name: Integration B (Sites)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 下载已验证构建产物
        uses: actions/download-artifact@v4
        with:
          name: userscript-build
          path: dist

      - name: 重建汉化审计安装脚本
        run: node tools/manual-coverage-audit/build-userscript.mjs

      - name: 集成测试 B（站点适配组）
        run: node tests/run.mjs --suite=sites

      - name: 上传汉化、审计与字体测试脚本
        uses: actions/upload-artifact@v4
        with:
          name: site-test-userscripts
          path: |
            dist/ff14-miramiru-zh-*-test.user.js
            dist/ff14-chinese-font-*-test.user.js
            dist/ff14-eden-zh-*-test.user.js
            dist/ff14-xivc-zh-*-test.user.js
            tools/manual-coverage-audit/FF14-Coverage-Audit-V1.1.user.js
          retention-days: 14
          if-no-files-found: error
