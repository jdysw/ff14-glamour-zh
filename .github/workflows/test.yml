name: Test

# v1.4 Phase 17：CI 测试工作流（与本地同一入口，命令全部可本地复跑）。
# 覆盖：数据文件结构校验 → 构建（含版本同步与词典三方核验）→
#       产物语法检查 → 生成物一致性（构建后工作区应无差异）→ 单元 + 集成（离线夹具）测试。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 数据文件校验
        run: npm run validate:data

      - name: 构建与校验
        run: npm run build

      - name: 产物语法检查
        run: npm run check:dist

      - name: 覆盖审计 Python 云端执行器语法检查
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('tools/coverage-audit/cloud-audit.py').read_text(encoding='utf-8'))"

      - name: 云端审计 URL / 注入失败防线回归（纯标准库）
        run: python3 -m unittest discover -s tools/coverage-audit -p 'test_cloud_audit.py'

      # 生成物入库纪律：src 模块 / 词典块 / 版本号均为构建生成物，
      # 构建后工作区应无差异（有差异 = 提交内容与构建链输出不同步）。
      - name: 构建后工作区一致性
        run: git diff --exit-code

      - name: 构建可重现与损坏产物拒绝
        run: npm run test:build

      - name: 共享已验证的 userscript
        uses: actions/upload-artifact@v4
        with:
          name: userscript-build
          path: |
            dist/ff14-glamour-zh.greasyfork.user.js
            dist/ff14-glamour-zh.greasyfork.user.js.map
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Native Source Coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成真实 V8 / LCOV 源码覆盖率
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: native-source-lcov
          path: tests/.cache/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

  contracts:
    name: Data Contracts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 验证数据加载、分类和部署契约
        run: npm run test:contracts

  integration-a:
    name: Integration A (Wiki)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 下载已验证构建产物
        uses: actions/download-artifact@v4
        with:
          name: userscript-build
          path: dist

      - name: 集成测试 A（wiki 夹具组）
        run: node tests/run.mjs --suite=wiki

  integration-b:
    name: Integration B (Sites)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁文件）
        run: npm ci

      - name: 下载已验证构建产物
        uses: actions/download-artifact@v4
        with:
          name: userscript-build
          path: dist

      - name: 重建汉化审计安装脚本
        if: github.event_name == 'workflow_dispatch'
        run: node tools/manual-coverage-audit/build-userscript.mjs

      - name: 集成测试 B（站点适配组）
        env:
          ZHX_E2E_COVERAGE_DIR: tests/.cache/e2e-coverage
        run: node tests/run.mjs --suite=sites

      - name: 上传站点浏览器实际执行覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: e2e-source-sites
          path: tests/.cache/e2e-coverage
          retention-days: 1
          if-no-files-found: error

      - name: 验证按需的工具与独立安装包
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e-tools

      - name: 上传汉化、审计与字体测试脚本
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: site-test-userscripts
          path: |
            dist/ff14-miramiru-zh-*-test.user.js
            dist/ff14-chinese-font-*-test.user.js
            dist/ff14-eden-zh-*-test.user.js
            dist/ff14-xivc-zh-*-test.user.js
            tools/manual-coverage-audit/FF14-Coverage-Audit-V1.1.user.js
          retention-days: 14
          if-no-files-found: error

  sonarqube-cloud:
    name: SonarQube Cloud Scan
    needs: [coverage, integration-a, integration-b]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：新代码判定与逐行归属需要

      - name: 下载同一提交的 V8 / LCOV 报告
        uses: actions/download-artifact@v4
        with:
          name: native-source-lcov
          path: tests/.cache/coverage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载同一提交的浏览器产物和 source map
        uses: actions/download-artifact@v4
        with:
          name: userscript-build
          path: dist

      - name: 下载已有端到端流程的实际 V8 覆盖率
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-source-*
          merge-multiple: true
          path: tests/.cache/e2e-coverage

      - name: 合并端到端源码行覆盖（不重复执行测试）
        run: node tools/coverage/merge-browser-coverage.mjs

      # 官方扫描 action（v6：使用当前受支持版本）
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 扫描执行成功不代表质量门禁通过；必须等待服务器端 Quality Gate 结果。
      - name: 等待 SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Quality Gate 通过仍可能留有历史问题；独立导出 main 上真正未解决的告警。
      # 问题位置进入 Actions 工件，令牌只用于请求授权，绝不存入工件。
      - name: 导出 main 分支全部未解决 Sonar 告警
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=jdysw_ff14-glamour-zh" \
            --data-urlencode "branch=main" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            | jq '{total, paging, issues: [.issues[] | {
                key, rule, severity, type, message, component,
                line: (.line // .textRange.startLine // null),
                effort, status, impacts
              }]}' > sonar-unresolved.json
          jq -r '.total' sonar-unresolved.json
          jq -r '.issues[] | [.rule, .severity, .component,
            (.line // "-"), .message] | @tsv' sonar-unresolved.json
          jq -e '(.total // 0) <= 500' sonar-unresolved.json >/dev/null
      - name: 上传 Sonar 未解决告警清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-unresolved-main
          path: sonar-unresolved.json
          if-no-files-found: warn

      # PR 分支单独统计本次改动引起的 Sonar 告警，避免与历史 main 告警混淆。
      - name: 导出当前 PR 未解决 Sonar 告警
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "componentKeys=jdysw_ff14-glamour-zh" \
            --data-urlencode "pullRequest=${SONAR_PR_NUMBER}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            | jq '{total, issues: [.issues[] | {
                key, rule, severity, message, component,
                line: (.line // .textRange.startLine // null), status
              }]}' > sonar-unresolved-pr.json
          jq -r '.total' sonar-unresolved-pr.json
          jq -r '.issues[] | [.rule, .component, (.line // "-"), .message] | @tsv' sonar-unresolved-pr.json
      - name: 上传当前 PR 未解决 Sonar 告警清单
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-unresolved-pr
          path: sonar-unresolved-pr.json
          if-no-files-found: error

      # 记录 Sonar 服务端真实统计口径；覆盖率不能只看 V8 测试终端输出。
      # PR 与 main 分支分别查询，避免把“新代码覆盖率”误称成全项目覆盖率。
      - name: 导出 Sonar 全量覆盖率与未覆盖文件明细
        if: ${{ success() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p sonar-metrics
          scope="branch=main"
          if [ "$SONAR_EVENT" = "pull_request" ]; then
            scope="pullRequest=$SONAR_PR_NUMBER"
          fi
          metrics="coverage,line_coverage,branch_coverage,lines_to_cover,uncovered_lines,conditions_to_cover,uncovered_conditions"
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "component=jdysw_ff14-glamour-zh" \
            --data-urlencode "metricKeys=$metrics" \
            --data-urlencode "$scope" \
            "https://sonarcloud.io/api/measures/component" \
            | jq '{component: .component.key, measures: .component.measures}' > sonar-metrics/overall.json
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "component=jdysw_ff14-glamour-zh" \
            --data-urlencode "metricKeys=$metrics" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "ps=500" \
            --data-urlencode "$scope" \
            "https://sonarcloud.io/api/measures/component_tree" \
            | jq '{paging, components: [.components[] | {key, path, qualifier, measures}]}' > sonar-metrics/files.json
          jq -r '.measures[] | [.metric, (.value // "-")] | @tsv' sonar-metrics/overall.json
          jq -r '.components[] | [.path, ([.measures[] | select(.metric == "coverage") | .value][0] // "0")] | @tsv' sonar-metrics/files.json
          jq -e '(.paging.total // 0) <= 500' sonar-metrics/files.json >/dev/null
          # PR 文件树仅显示变更文件；必须另取 main 全部文件，不能据此错误排序。
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "component=jdysw_ff14-glamour-zh" \
            --data-urlencode "metricKeys=$metrics" \
            --data-urlencode "branch=main" \
            "https://sonarcloud.io/api/measures/component" \
            | jq '{component: .component.key, measures: .component.measures}' > sonar-metrics/overall-main.json
          curl --fail --silent --show-error --get \
            --user "${SONAR_TOKEN}:" \
            --data-urlencode "component=jdysw_ff14-glamour-zh" \
            --data-urlencode "metricKeys=$metrics" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "ps=500" \
            --data-urlencode "branch=main" \
            "https://sonarcloud.io/api/measures/component_tree" \
            | jq '{paging, components: [.components[] | {key, path, qualifier, measures}]}' > sonar-metrics/files-main.json
          jq -r '"main 全量覆盖率：" + ([.measures[] | select(.metric == "coverage") | .value][0] // "未取得")' sonar-metrics/overall-main.json
          jq -r '.components[] | [.path, ([.measures[] | select(.metric == "coverage") | .value][0] // "-")] | @tsv' sonar-metrics/files-main.json
          jq -e '(.paging.total // 0) <= 500' sonar-metrics/files-main.json >/dev/null

      - name: 上传 Sonar 实际覆盖率与文件级缺口
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage-metrics
          path: sonar-metrics/*.json
          if-no-files-found: warn
