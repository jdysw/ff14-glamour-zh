<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>collection-search fixture</title>
</head>
<body>
  <!-- collection 风格：搜索框位于侧栏 widget、不属于任何 form -->
  <aside class="blur">
    <div class="widget_text widget">
      <div class="textwidget custom-html-widget">
        <ul class="widget-container widget-container-single">
          <li class="widget-item-text">
            <input type="text" name="keyword" value="" placeholder="調べたいキーワードを入力">
          </li>
        </ul>
      </div>
    </div>
  </aside>
  <div id="main"><p>コンテンツ</p></div>
</body>
</html>
