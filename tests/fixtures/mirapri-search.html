<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>FF14ミラプリSS投稿・共有サイト | MIRAPRI SNAP</title>
</head>
<body>
<header><div id="search"><a id="toggle-right"><img src="icon.png" alt="搜索"></a></div></header>
<div id="searchMenu">
  <div class="inner">
    <form name="side-filter-form" class="filter-form" action="https://mirapri.com/" accept-charset="UTF-8" method="get">
      <nav class="category">
        <h3>KEYWORD</h3>
        <ul>
          <li><input type="text" name="keyword" id="equip-name-field" placeholder="装備品名等を入力" size="50"></li>
        </ul>
      </nav>
      <nav class="category">
        <h3 class="sort">SORT</h3>
        <ul>
          <li><select name="period" id="period"><option value="">期間指定なし</option><option value="1">今日</option><option value="2">週間</option><option value="3">月間</option><option value="0">全期間</option></select></li>
          <li><select name="sort" id="sort"><option value="">並び順指定なし</option><option value="1">イイ数が多い順</option><option value="2">PV数が多い順</option></select></li>
        </ul>
      </nav>
      <p class="submit middle"><input type="submit" value="この条件で検索" data-disable-with="この条件で検索"></p>
      <input type="hidden" name="g" id="g">
      <input type="hidden" name="cl" id="cl">
      <input type="hidden" name="j" id="j">
      <input type="hidden" name="r" id="r">
      <input type="hidden" name="t" id="t">
      <input type="hidden" name="c" id="c">
      <input type="hidden" name="fav" id="fav">
    </form>
  </div>
</div>
<main>
  <p>テスト用夹具页面（mirapri 搜索表单同构）。</p>
</main>
</body>
</html>
